<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Automate 3D - Optimisation VRAM et Sphères</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; color: #888; font-family: sans-serif; cursor: crosshair; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-container { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }

        .workspace { position: absolute; pointer-events: auto; user-select: none; background: #111113; border: 1px solid #222; border-radius: 2px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: default; }
        .workspace-title { position: relative; padding: 6px 12px; cursor: move; font-weight: bold; font-size: 13px; color: #ccc; letter-spacing: 1px; text-align: center; border-bottom: 1px solid #222; background: #161618; flex-shrink: 0; }
        .workspace-title:hover { background: #1a1a1d; color: #ddd; }
        .workspace-reorg { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 14px; color: #555; padding: 2px 6px; border-radius: 2px; }
        .workspace-reorg:hover { color: #888; background: #1a1a1d; }
        .workspace-viewport { flex: 1; min-height: 0; overflow: hidden; position: relative; background: #131315; }
        .workspace-content { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        .workspace-resize { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #444 50%, #444 55%, transparent 55%, transparent 65%, #444 65%, #444 70%, transparent 70%); opacity: 0.25; flex-shrink: 0; z-index: 1; }
        .workspace-resize:hover { opacity: 0.6; }

        .block { position: absolute; background: #161618; border: 1px solid #222; border-radius: 2px; width: 300px; pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.3); user-select: none; }
        .block-title { padding: 6px 12px; cursor: move; font-weight: bold; font-size: 12px; color: #ccc; letter-spacing: 0.5px; border-bottom: 1px solid #222; text-align: center; background: #1a1a1d; }
        .block-title:hover { background: #1f1f22; color: #ddd; }
        .block-content { padding: 8px 12px 10px 12px; }
        .block label { display: block; margin-top: 7px; font-size: 12px; color: #888; }
        .slider-row { display: flex; gap: 4px; align-items: center; margin-top: 3px; }
        .slider-row input[type=range] { flex: 1; }
        .slider-num { width: 58px; background: #161618; color: #aaa; border: 1px solid #2a2a2a; border-radius: 2px; padding: 3px 5px; font-size: 12px; font-family: monospace; text-align: right; outline: none; }
        .slider-num:focus { border-color: #444; }
        .slider-num::-webkit-inner-spin-button { opacity: 0.3; }
        .block input[type=range] { width: 100%; margin-top: 3px; -webkit-appearance: none; appearance: none; background: transparent; }
        .block input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #2a2a2a; border-radius: 2px; }
        .block input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; background: #555; border-radius: 50%; margin-top: -4px; cursor: pointer; border: none; }
        .block input[type=range]::-webkit-slider-thumb:hover { background: #777; }
        .block input[type=range]::-moz-range-track { height: 4px; background: #2a2a2a; border-radius: 2px; border: none; }
        .block input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: #555; border-radius: 50%; cursor: pointer; border: none; }
        .block input[type=range]::-moz-range-thumb:hover { background: #777; }
        .menu-btn { margin-top: 7px; width: 100%; padding: 7px; background: #1a1a1a; color: #999; border: 1px solid #2a2a2a; border-radius: 2px; cursor: pointer; font-weight: bold; transition: 0.15s; font-size: 12px; }
        .menu-btn:hover { background: #222; color: #aaa; }
        .active-brush { background: #222 !important; border-color: #3a3a3a !important; color: #999 !important; }
        .active-force { background: #222 !important; border-color: #3a3a3a !important; color: #999 !important; }
        .btn-group { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
        .btn-group button { margin-top: 0 !important; font-size: 11px; padding: 5px 4px; flex: 1 1 45%; background: #161618; color: #666; border: 1px solid #222; border-radius: 2px; cursor: pointer; }
        .btn-group button:hover { background: #1a1a1d; color: #888; }
        .color-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .color-row label { margin-top: 0 !important; flex: 1; }
        .color-swatch { width: 44px; height: 22px; padding: 1px; background: #161618; border: 1px solid #2a2a2a; border-radius: 2px; cursor: pointer; }
        .color-swatch:hover { border-color: #444; }
        .color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
        .color-swatch::-webkit-color-swatch { border: none; border-radius: 1px; }

        #error-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-size: 18px; display: none; text-align:center; border-radius: 2px; z-index: 100; box-shadow: 0 0 20px rgba(0,0,0,0.8); font-family: monospace; }
        .splitter { position: absolute; background: rgba(80,80,80,0.3); z-index: 5; display: none; }
        .splitter.active { display: block; }
        .splitter:hover { background: rgba(100,100,100,0.6); }
        #split-v { top: 0; bottom: 0; width: 8px; cursor: col-resize; transform: translateX(-4px); }
        #split-h { left: 0; right: 0; height: 8px; cursor: row-resize; transform: translateY(-4px); }
        .view-label { 
            position: absolute; 
            padding: 4px 8px; 
            background: rgba(0, 0, 0, 0.6); 
            color: #aaa; 
            font-size: 11px; 
            font-weight: bold; 
            letter-spacing: 1px;
            border-radius: 3px; 
            pointer-events: none;
            z-index: 6; 
            display: none; 
            text-transform: uppercase;
        }
        .view-label.active { display: block; }
    </style>
</head>
<body>
    <div id="error-msg">⚠️ Serveur local requis ou WebGPU non supporté.</div>
    <div id="split-v" class="splitter"></div>
    <div id="split-h" class="splitter"></div>
    
    <!-- ÉTIQUETTES DES VUES -->
    <div id="label-0" class="view-label">Dessus</div>
    <div id="label-1" class="view-label">Perspective (Libre)</div>
    <div id="label-2" class="view-label">Face</div>
    <div id="label-3" class="view-label">Côté</div>
    
    <div id="ui-container"></div>
    <canvas id="univers"></canvas>

    <script type="module">
        import { config } from './config.js';
        import { state } from './state.js';
        import { initGPU, gpu } from './gpu/device.js';
        import { uniformBuffer, uniformData, uniformDataU32, createUniformBuffer, uploadUniforms } from './gpu/uniforms.js';
        import { vSub, vAdd, vScale, vLen, vNorm, vCross } from './math/vector.js';
        import { computeRay } from './math/ray.js';
        import { raycastWgslCode } from './shaders/compute/raycast.wgsl.js';
        import { getPhysicsWgslCode } from './shaders/physics/physics.wgsl.js';
        import { renderWgslCode } from './shaders/render/render.wgsl.js';
        import { debugWgslCode } from './shaders/render/debug.wgsl.js';
        import { postWgslCode } from './shaders/render/post.wgsl.js';
        import { buildCompactShader } from './shaders/compute/compact.wgsl.js';
        import { lightingWgslCode } from './shaders/compute/lighting.wgsl.js';
        import { buildUI, wireBindings } from './ui.js';

        (async function initWebGPU() {
            const canvas = document.getElementById('univers');
            canvas.addEventListener('contextmenu', e => e.preventDefault());

            buildUI(document.getElementById('ui-container'));
            wireBindings();

            await initGPU(canvas);

            // --- GPU name (one-shot) ---
            document.querySelectorAll('[data-diag="gpuname"]').forEach(f => f.textContent = gpu.adapter.name || 'Inconnu');

            const compactWgslCode = buildCompactShader();

            const renderShaderModule = gpu.device.createShaderModule({ code: renderWgslCode });
            const debugShaderModule = gpu.device.createShaderModule({ code: debugWgslCode });
            
            // --- NOUVEAU : PIPELINE POST-PROCESS ---
            const postShaderModule = gpu.device.createShaderModule({ code: postWgslCode });
            const postPipeline = gpu.device.createRenderPipeline({
                layout: "auto",
                vertex: { module: postShaderModule, entryPoint: 'vertexMain' },
                fragment: { module: postShaderModule, entryPoint: 'fragmentMain', targets: [{ format: gpu.presentationFormat }] },
                primitive: { topology: 'triangle-list' }
            });
            const postSampler = gpu.device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });
            
            const bindGroupLayout = gpu.device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
                    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }
                ]
            });
            const cGroupLayout2 = gpu.device.createBindGroupLayout({ entries: [{ binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } }, { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }, { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }, { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }, { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }, { binding: 6, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } }, { binding: 7, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } } ] });
            
            // --- NOUVEAU : Recompilation Dynamique du Pipeline ---
            let collectPipeline, computePipeline;

            function recompilePhysicsPipeline() {
                // 1. On demande le nouveau code basé sur les boutons activés
                const newCode = getPhysicsWgslCode(state.features);
                const newShaderModule = gpu.device.createShaderModule({ code: newCode });

                // 2. On recrée la passe de Collecte
                collectPipeline = gpu.device.createComputePipeline({ 
                    layout: gpu.device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }), 
                    compute: { module: newShaderModule, entryPoint: 'collectChunksMain' } 
                });

                // 3. On recrée la passe de Physique
                computePipeline = gpu.device.createComputePipeline({ 
                    layout: gpu.device.createPipelineLayout({ bindGroupLayouts: [cGroupLayout2] }), 
                    compute: { module: newShaderModule, entryPoint: 'computeMain' } 
                });
            }

            // On connecte cette fonction au "cerveau" (state.js)
            state._recompile = recompilePhysicsPipeline;

            // On compile une première fois au lancement de la page !
            recompilePhysicsPipeline();
            // ------------------------------------------------------
            
            const renderBindGroupLayout = gpu.device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
                    { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                    { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                    { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } } // ancien : debug prend colliders au bind 3
                ]
            });
            // Pour le debug des colliders
            const debugPipelineLayout = gpu.device.createPipelineLayout({ bindGroupLayouts: [
                gpu.device.createBindGroupLayout({
                    entries: [
                        { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
                        { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                        { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                        { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } }
                    ]
                })
            ]});

            // --- NOUVEAU : PIPELINE DE LUMIÈRE (DEFERRED) ---
            const lightingBindGroupLayout = gpu.device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
                    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
                    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
                    { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } }
                ]
            });
            const lightingShaderModule = gpu.device.createShaderModule({ code: lightingWgslCode });
            const lightingPipeline = gpu.device.createComputePipeline({
                layout: gpu.device.createPipelineLayout({ bindGroupLayouts: [lightingBindGroupLayout] }),
                compute: { module: lightingShaderModule, entryPoint: 'lightingMain' }
            });

            const renderPipelineLayoutCompacted = gpu.device.createPipelineLayout({ bindGroupLayouts: [
                gpu.device.createBindGroupLayout({
                    entries: [
                        { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
                        { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                        { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                        { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
                        { binding: 4, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } }
                    ]
                })
            ]});

            const raycastBindGroupLayout = gpu.device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
                    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }
                ]
            });
            const raycastShaderModule = gpu.device.createShaderModule({ code: raycastWgslCode });
            const raycastPipeline = gpu.device.createComputePipeline({ layout: gpu.device.createPipelineLayout({ bindGroupLayouts: [raycastBindGroupLayout] }), compute: { module: raycastShaderModule, entryPoint: 'raycastMain' } });

            const compactBindGroupLayout = gpu.device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
                    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
                    { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
                    { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } }
                ]
            });
            const compactShaderModule = gpu.device.createShaderModule({ code: compactWgslCode });
            const compactPipeline = gpu.device.createComputePipeline({ layout: gpu.device.createPipelineLayout({ bindGroupLayouts: [compactBindGroupLayout] }), compute: { module: compactShaderModule, entryPoint: 'compactMain' } });

            const renderPipeline = gpu.device.createRenderPipeline({ 
                layout: renderPipelineLayoutCompacted, vertex: { module: renderShaderModule, entryPoint: 'vertexMain' }, fragment: { module: renderShaderModule, entryPoint: 'fragmentMain', targets: [{ format: gpu.presentationFormat }] }, primitive: { topology: 'triangle-list' }, depthStencil: { depthWriteEnabled: true, depthCompare: 'less', format: 'depth24plus' } 
            });

            const debugPipeline = gpu.device.createRenderPipeline({
                layout: debugPipelineLayout, vertex: { module: debugShaderModule, entryPoint: 'vertexMain' }, fragment: { module: debugShaderModule, entryPoint: 'fragmentMain', targets: [{ format: gpu.presentationFormat }] }, primitive: { topology: 'line-list' }, depthStencil: { depthWriteEnabled: true, depthCompare: 'less', format: 'depth24plus' }
            });

            createUniformBuffer();

            let gridBuffer, activityBuffer, activeChunksBuffer, indirectBuffer, paintPosBuffer, bindGroupCollect, bindGroupCompute, bindGroupRaycast;
            let visibleBuffer, drawIndirectBuffer, bindGroupCompact;
            let lightingBuffer;
            let lightDispatchBuffer;
            const resetIndirectArray = new Uint32Array([0, 1, 1]);
            const resetDrawArray = new Uint32Array([6, 0, 0, 0]);
            const resetLightArray = new Uint32Array([0, 1, 1]);
            
            // ============================================
            // FIX CPU/RAM : CREATION UNIQUE DU TABLEAU
            // ============================================
            let collidersBuffer;
            const colArray = new Float32Array(100 * 4); // C'est CA qui stoppe le lag CPU
            // --- NOUVEAU : GESTION DES TEXTURES OFFSCREEN ---
            let depthTexture, colorTexture, postBindGroup;

            function updateDepthTexture() {
                if (depthTexture) depthTexture.destroy();
                if (colorTexture) colorTexture.destroy();
                
                // Texture de Profondeur (Z-Depth)
                depthTexture = gpu.device.createTexture({ 
                    size: [canvas.width, canvas.height, 1], 
                    format: 'depth24plus', 
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING 
                });
                // Image Couleur Invisible (Offscreen)
                colorTexture = gpu.device.createTexture({ 
                    size: [canvas.width, canvas.height, 1], 
                    format: gpu.presentationFormat, 
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING 
                });

                // On connecte les textures au shader Post-Process
                postBindGroup = gpu.device.createBindGroup({
                    layout: postPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: colorTexture.createView() },
                        { binding: 1, resource: depthTexture.createView() },
                        { binding: 3, resource: { buffer: uniformBuffer } }
                    ]
                });
            }

            window.clearGrid = () => { 
                gpu.device.queue.writeBuffer(gridBuffer, 0, new Uint32Array(state.gx * state.gy * state.gz));
                gpu.device.queue.writeBuffer(activityBuffer, 0, new Uint32Array(Math.ceil(state.gx/config.CHUNK_SIZE) * Math.ceil(state.gy/config.CHUNK_SIZE) * Math.ceil(state.gz/config.CHUNK_SIZE)));
            }

            function initBuffers() {
                state.gx = parseInt(document.getElementById('inpResX').value); state.gy = parseInt(document.getElementById('inpResY').value); state.gz = parseInt(document.getElementById('inpResZ').value);
                
                let totalVoxels = state.gx * state.gy * state.gz;
                let bufferSize = totalVoxels * 4; 
                let cResX = Math.ceil(state.gx / config.CHUNK_SIZE); let cResY = Math.ceil(state.gy / config.CHUNK_SIZE); let cResZ = Math.ceil(state.gz / config.CHUNK_SIZE);
                let totalChunks = cResX * cResY * cResZ;
                let activitySize = totalChunks * 4; let activeChunksSize = totalChunks * 4; let indirectSize = 12; 
                
                document.querySelectorAll('[data-diag="voxels"]').forEach(f => f.innerText = totalVoxels.toLocaleString() + " Voxels");
                document.querySelectorAll('[data-diag="vram"]').forEach(f => f.innerText = "💾 VRAM : " + ((bufferSize + activitySize + activeChunksSize + bufferSize) / 1024 / 1024).toFixed(3) + " MB (dont liste compactée pour le rendu)");

                let maxBinding = gpu.adapter.limits.maxStorageBufferBindingSize;
                if(bufferSize > maxBinding) { 
                    document.getElementById('error-msg').innerHTML = `⚠️ Limite VRAM dépassée.<br>Ta limite GPU est de ${Math.floor(maxBinding/1024/1024)} MB.<br>Réduis la taille de la grille.`;
                    document.getElementById('error-msg').style.display = 'block'; 
                    return; 
                } else { document.getElementById('error-msg').style.display = 'none'; }
                
                if(gridBuffer) gridBuffer.destroy(); if(activityBuffer) activityBuffer.destroy(); if(activeChunksBuffer) activeChunksBuffer.destroy(); if(indirectBuffer) indirectBuffer.destroy(); if(paintPosBuffer) paintPosBuffer.destroy(); if(collidersBuffer) collidersBuffer.destroy();
                if(visibleBuffer) visibleBuffer.destroy(); if(drawIndirectBuffer) drawIndirectBuffer.destroy();
                if(lightingBuffer) lightingBuffer.destroy();
                if(lightDispatchBuffer) lightDispatchBuffer.destroy();
                if(window.viewUniformBuffers) { for(let i = 0; i < 4; i++) { if(window.viewUniformBuffers[i]) window.viewUniformBuffers[i].destroy(); } }

                gridBuffer = gpu.device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
                activityBuffer = gpu.device.createBuffer({ size: activitySize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
                activeChunksBuffer = gpu.device.createBuffer({ size: activeChunksSize, usage: GPUBufferUsage.STORAGE });
                indirectBuffer = gpu.device.createBuffer({ size: indirectSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.INDIRECT | GPUBufferUsage.COPY_DST });
                paintPosBuffer = gpu.device.createBuffer({ size: 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
                collidersBuffer = gpu.device.createBuffer({ size: 1600, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
                visibleBuffer = gpu.device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
                lightingBuffer = gpu.device.createBuffer({ size: bufferSize, usage: GPUBufferUsage.STORAGE });
                lightDispatchBuffer = gpu.device.createBuffer({ size: 12, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.INDIRECT | GPUBufferUsage.COPY_DST });
                drawIndirectBuffer = gpu.device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.INDIRECT | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
                
                // Buffers Audio
                if(window.soundBuffer) window.soundBuffer.destroy();
                if(window.soundReadBuffer) window.soundReadBuffer.destroy();
                window.soundBuffer = gpu.device.createBuffer({ size: 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
                window.soundReadBuffer = gpu.device.createBuffer({ size: 32, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
                
                clearGrid();
                resetCamTargets();
                bindGroupCollect = gpu.device.createBindGroup({ layout: bindGroupLayout, entries: [{ binding: 0, resource: { buffer: uniformBuffer } }, { binding: 1, resource: { buffer: gridBuffer } }, { binding: 2, resource: { buffer: activityBuffer } }, { binding: 3, resource: { buffer: activeChunksBuffer } }, { binding: 4, resource: { buffer: indirectBuffer } }, { binding: 5, resource: { buffer: paintPosBuffer } } ] });
                bindGroupCompute = gpu.device.createBindGroup({ layout: cGroupLayout2, entries: [{ binding: 0, resource: { buffer: uniformBuffer } }, { binding: 1, resource: { buffer: gridBuffer } }, { binding: 2, resource: { buffer: activityBuffer } }, { binding: 3, resource: { buffer: activeChunksBuffer } }, { binding: 5, resource: { buffer: paintPosBuffer } }, { binding: 6, resource: { buffer: collidersBuffer } }, { binding: 7, resource: { buffer: window.soundBuffer } } ] });
                
                window.viewUniformBuffers = [];
                window.viewBindGroupLighting = [];
                window.viewBindGroupRender = [];
                window.viewBindGroupDebug = [];

                for (let i = 0; i < 4; i++) {
                    window.viewUniformBuffers[i] = gpu.device.createBuffer({ size: config.UNIFORM_BUFFER_SIZE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
                    
                    window.viewBindGroupLighting[i] = gpu.device.createBindGroup({ layout: lightingBindGroupLayout, entries: [
                        { binding: 0, resource: { buffer: window.viewUniformBuffers[i] } }, 
                        { binding: 1, resource: { buffer: gridBuffer } }, 
                        { binding: 2, resource: { buffer: visibleBuffer } }, 
                        { binding: 3, resource: { buffer: lightingBuffer } }, 
                        { binding: 4, resource: { buffer: drawIndirectBuffer } }
                    ]});

                    const compLayout = renderPipeline.getBindGroupLayout(0);
                    window.viewBindGroupRender[i] = gpu.device.createBindGroup({ layout: compLayout, entries: [
                        { binding: 0, resource: { buffer: window.viewUniformBuffers[i] } }, 
                        { binding: 1, resource: { buffer: gridBuffer } }, 
                        { binding: 2, resource: { buffer: paintPosBuffer } }, 
                        { binding: 3, resource: { buffer: visibleBuffer } },
                        { binding: 4, resource: { buffer: lightingBuffer } }
                    ]});

                    const dbgLayout = debugPipeline.getBindGroupLayout(0);
                    window.viewBindGroupDebug[i] = gpu.device.createBindGroup({ layout: dbgLayout, entries: [
                        { binding: 0, resource: { buffer: window.viewUniformBuffers[i] } }, 
                        { binding: 1, resource: { buffer: gridBuffer } }, 
                        { binding: 2, resource: { buffer: paintPosBuffer } }, 
                        { binding: 3, resource: { buffer: collidersBuffer } }
                    ]});
                }
                
                bindGroupRaycast = gpu.device.createBindGroup({ layout: raycastBindGroupLayout, entries: [{ binding: 0, resource: { buffer: uniformBuffer } }, { binding: 1, resource: { buffer: gridBuffer } }, { binding: 2, resource: { buffer: paintPosBuffer } }] });
                bindGroupCompact = gpu.device.createBindGroup({ layout: compactBindGroupLayout, entries: [

                let gain = audioCtx.createGain();
                
                let vol = Math.min(intensity * 0.4, 0.3); 
                
                if (matId === 2) {

                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                    window.soundReadBuffer.mapAsync(GPUMapMode.READ).then(() => {
                        const arr = new Uint32Array(window.soundReadBuffer.getMappedRange());
                        
                        let nowMs = performance.now();
                        let isPainting = state.mouse.active === 1;
                        let activeTool = state.mouse.tool;

                        for(let mat = 2; mat <= 4; mat++) {
                            let gpuMovement = arr[mat]; 
                            let paintMovement = (isPainting && activeTool === mat) ? 300 : 0; 
                            let totalMovement = gpuMovement + paintMovement;

                            if (totalMovement > 20) {
                                let throttleMs = mat === 3 ? 80 : 120;
                                
                                if (nowMs - lastPlayTime[mat] > throttleMs) {
                                    let intensity = Math.min(totalMovement / 1500, 1.0);
                                    playImpactSound(mat, intensity);
                                    lastPlayTime[mat] = nowMs;
                                }
                            }
                        }

                        window.soundReadBuffer.unmap();
                        state.isReadingSound = false;
                    }).catch(() => { state.isReadingSound = false; });
                }

                const commandBuffers = [];
                const computeEncoder = gpu.device.createCommandEncoder(); 
                
                const raycastPass = computeEncoder.beginComputePass(); raycastPass.setPipeline(raycastPipeline); raycastPass.setBindGroup(0, bindGroupRaycast); raycastPass.dispatchWorkgroups(1, 1, 1); raycastPass.end();
                
                const computePass1 = computeEncoder.beginComputePass(); computePass1.setPipeline(collectPipeline); computePass1.setBindGroup(0, bindGroupCollect); let nChunks = Math.ceil(state.gx/config.CHUNK_SIZE) * Math.ceil(state.gy/config.CHUNK_SIZE) * Math.ceil(state.gz/config.CHUNK_SIZE); computePass1.dispatchWorkgroups(Math.ceil(nChunks / 64), 1, 1); computePass1.end(); 
                
                const computePass2 = computeEncoder.beginComputePass(); computePass2.setPipeline(computePipeline); computePass2.setBindGroup(0, bindGroupCompute); computePass2.dispatchWorkgroupsIndirect(indirectBuffer, 0); computePass2.end(); 
                
                const totalVoxels = state.gx * state.gy * state.gz; const compactWgCount = Math.ceil(totalVoxels / 256); const compactDispX = Math.min(compactWgCount, config.COMPACT_WG_X); const compactDispY = Math.ceil(compactWgCount / config.COMPACT_WG_X);
                const compactPass = computeEncoder.beginComputePass(); compactPass.setPipeline(compactPipeline); compactPass.setBindGroup(0, bindGroupCompact); compactPass.dispatchWorkgroups(compactDispY > 1 ? config.COMPACT_WG_X : compactDispX, compactDispY, 1); compactPass.end();

                commandBuffers.push(computeEncoder.finish());
                
                let curTexView = gpu.context.getCurrentTexture().createView(); 
                let curDepthView = depthTexture.createView();
                let offscreenColorView = colorTexture.createView();
                
                // 1. DESSINER LES VUES (Une par une)
                for (let i = 0; i < views.length; i++) {
                    const v = views[i]; 
                    uniformData[11] = v.rotX; uniformData[12] = v.rotY; 
                    uniformData[84] = Math.sin(-v.rotX); uniformData[85] = Math.cos(-v.rotX);
                    uniformData[86] = Math.sin(-v.rotY); uniformData[87] = Math.cos(-v.rotY);
                    uniformData[15] = v.w; uniformData[16] = v.h; uniformData[23] = v.ortho; 
                    uniformData[6] = (state.mouse.active && state.activeViewIndex === v.id) ? 1.0 : 0.0; 
                    const vt = state.camTargets[v.id] || state.camTargets[3]; 
                    uniformData[33] = vt[0]; uniformData[34] = vt[1]; uniformData[35] = vt[2]; 
                    uniformData[14] = state.camZooms[v.id] !== undefined ? state.camZooms[v.id] : state.camZooms[3];
                    
                    gpu.device.queue.writeBuffer(window.viewUniformBuffers[i], 0, uniformData);

                    const renderEncoder = gpu.device.createCommandEncoder(); 

                    // --- CALCUL DE LA LUMIÈRE SPÉCIFIQUE À CETTE VUE ---
                    const lightingPass = renderEncoder.beginComputePass();
                    lightingPass.setPipeline(lightingPipeline);
                    lightingPass.setBindGroup(0, window.viewBindGroupLighting[i]);
                    lightingPass.dispatchWorkgroupsIndirect(lightDispatchBuffer, 0);
                    lightingPass.end();
                    // -------------------------------------------------------------
                    
                    const loadOp = i === 0 ? 'clear' : 'load';
                    const renderPassDescriptor = { 
                        colorAttachments: [{ view: offscreenColorView, clearValue: { r: 0.015, g: 0.02, b: 0.03, a: 1.0 }, loadOp: loadOp, storeOp: 'store' }], 
                        depthStencilAttachment: { view: curDepthView, depthClearValue: 1.0, depthLoadOp: loadOp, depthStoreOp: 'store' } 
                    };
                    
                    const passEncoder = renderEncoder.beginRenderPass(renderPassDescriptor);
                    if (v.w > 0 && v.h > 0) { 
                        passEncoder.setViewport(v.x, v.y, v.w, v.h, 0, 1); 
                        passEncoder.setScissorRect(v.x, v.y, v.w, v.h); 
                        passEncoder.setPipeline(renderPipeline); 
                        passEncoder.setBindGroup(0, window.viewBindGroupRender[i]); 
                        passEncoder.drawIndirect(drawIndirectBuffer, 0); 
                        
                        passEncoder.setPipeline(debugPipeline); 
                        passEncoder.setBindGroup(0, window.viewBindGroupDebug[i]); 
                        passEncoder.draw(306 + Math.min(state.colliders.length, 100) * 192); 
                    }
                    passEncoder.end(); 

                    commandBuffers.push(renderEncoder.finish());
                }

                // 2. POST-PROCESS (Hors de la boucle)
                const postEncoder = gpu.device.createCommandEncoder();
                const postPass = postEncoder.beginRenderPass({
                    colorAttachments: [{ view: curTexView, clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }]
                });
                postPass.setPipeline(postPipeline);
                postPass.setBindGroup(0, postBindGroup);
                postPass.draw(3);
                postPass.end();
                commandBuffers.push(postEncoder.finish());

                gpu.device.queue.submit(commandBuffers);

                // --- Diagnostics ---
                let frameTime = performance.now() - now;
                let dcTotal = dcRender + dcDebug;
                uiCache.frametime.forEach(f => f.textContent = frameTime.toFixed(1) + 'ms');
                uiCache.bar.forEach(bar => { let pct = Math.min(100, (frameTime / 33.3) * 100); bar.style.width = pct + '%'; bar.style.background = frameTime < 16 ? '#3a5' : frameTime < 25 ? '#aa5' : '#a45'; });
                uiCache.drawcalls.forEach(f => f.textContent = dcTotal);
                uiCache.dcrender.forEach(f => f.textContent = dcRender);
                uiCache.dcdebug.forEach(f => f.textContent = dcDebug);
                uiCache.passes.forEach(f => f.textContent = views.length + ' / 4');
                uiCache.resolution.forEach(f => f.textContent = canvas.width + ' x ' + canvas.height);
                uiCache.multiview.forEach(f => f.textContent = state.multiView ? '4 Vues' : 'Single');
                uiCache.colliders.forEach(f => f.textContent = state.colliders.length);
                
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);

            document.getElementById('btnAddSphere').addEventListener('click', async () => { const readBuf = gpu.device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }); const enc = gpu.device.createCommandEncoder(); enc.copyBufferToBuffer(paintPosBuffer, 0, readBuf, 0, 16); gpu.device.queue.submit([enc.finish()]); await readBuf.mapAsync(GPUMapMode.READ); const arr = new Float32Array(readBuf.getMappedRange().slice(0)); readBuf.unmap(); readBuf.destroy(); state.colliders.push({ x: arr[0], y: arr[1], z: arr[2], radius: 20 }); state.activeCollider = state.colliders.length - 1; document.getElementById('inpColX').value = arr[0].toFixed(1); document.getElementById('inpColY').value = arr[1].toFixed(1); document.getElementById('inpColZ').value = arr[2].toFixed(1); document.getElementById('inpColRadius').value = 20; });
            document.getElementById('btnClearSpheres').addEventListener('click', () => { state.colliders = []; state.activeCollider = -1; });
        })();
    </script>
</body>
</html>
